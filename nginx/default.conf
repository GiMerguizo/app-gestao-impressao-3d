# Este Nginx só é publicado em 127.0.0.1:8080 no notebook.
# Quem recebe as conexões dos sócios é o "tailscale serve" (HTTPS), que repassa para cá.

# IP real do cliente (vem no X-Forwarded-For adicionado pelo tailscale serve).
set_real_ip_from 0.0.0.0/0;
real_ip_header X-Forwarded-For;

limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:5m  rate=20r/s;
limit_req_status 429;

upstream backend {
    server backend:3000;
    keepalive 8;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # 'unsafe-inline' é necessário porque a interface usa atributos onclick; todo texto do usuário passa por esc().
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    # Resposta JSON quando o backend está fora do ar (o frontend mostra "Servidor indisponível").
    error_page 502 503 504 = @indisponivel;
    location @indisponivel {
        default_type application/json;
        return 503 '{"erro":"servidor indisponível"}';
    }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend;
    }

    location = /api/stream {
        proxy_pass http://backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://backend;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;   # sem cache longo: atualizações aparecem no próximo carregamento
    }

    # Nunca servir arquivos ocultos.
    location ~ /\. { deny all; return 404; }
}
